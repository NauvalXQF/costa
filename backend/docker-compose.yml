services:
  costa-app:
    build: .
    container_name: costa-app
    restart: unless-stopped
    ports:
      - "8084:80"
    env_file:
      - .env
    environment:
      APP_NAME: Costa
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://costa.opankcs.com
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: costa.opankcs.com
    volumes:
      - ./database:/app/database
      - ./storage:/app/storage